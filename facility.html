<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facility · How Safe Is My Daycare?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,700;1,6..72,700&family=IBM+Plex+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="google-place.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="paper-head">
      <nav class="topline">
        <a href="about.html">How this works</a>
        <a href="https://divy.am" rel="noopener">Div Balani</a>
      </nav>
      <a class="mark" href="index.html">How <em>safe</em> is my daycare?</a>
      <div class="mast-rules">
        <div class="rule-3" aria-hidden="true"></div>
        <div class="rule-1" aria-hidden="true"></div>
        <div class="mast-meta">
          <span>Texas HHSC Child Care Licensing</span>
          <span>Austin default · Travis County</span>
          <span>Not an official state rating</span>
        </div>
        <div class="rule-double" aria-hidden="true"></div>
      </div>
    </header>
    <div class="page" id="app">
      <p class="muted" id="load-status">Opening the official record from Texas HHSC…</p>
    </div>
  </div>
  <footer>
    <div class="wrap">
      <div>Source: Texas HHSC Child Care Licensing open data. Not an official state grade.</div>
      <div><a href="about.html">Methodology</a></div>
    </div>
  </footer>
  <script>
(function () {
  var app = document.getElementById("app");
  var rendered = false;

  function showError(msg) {
    rendered = true;
    if (!app) return;
    app.innerHTML = '<div class="err"></div><p><a href="index.html">Back to search</a></p>';
    app.querySelector(".err").textContent = String(msg || "Could not load this record.");
  }

  window.addEventListener("error", function (ev) {
    if (!rendered) showError((ev && ev.message) || "Page script failed.");
  });
  window.addEventListener("unhandledrejection", function (ev) {
    if (!rendered) showError((ev && ev.reason && ev.reason.message) || "Request failed.");
  });
  setTimeout(function () {
    if (rendered) return;
    var el = document.getElementById("load-status");
    if (el) el.textContent = "Still talking to Texas HHSC. This can take a few seconds on a cold pull…";
  }, 2000);
  setTimeout(function () {
    if (!rendered) showError("Texas open data is taking too long. Refresh to try again.");
  }, 10000);

  var SODA = "https://data.texas.gov/resource";
  var OPS = SODA + "/bc5r-88dy.json";
  var ACT = SODA + "/m5q4-3y3d.json";
  var NC = SODA + "/tqgd-mf4x.json";

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function zipOf(op) {
    return String((op && op.zipcode) || "").replace(/\s+/g, " ").trim().slice(0, 5);
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  function signed(n) {
    var v = Number(n) || 0;
    if (v > 0) return "+" + v;
    if (v < 0) return "\u2212" + Math.abs(v);
    return "0";
  }

function daysAgo(raw) {
  if (!raw) return null;
  var d = new Date(raw);
  if (Number.isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function defWhen(d) {
  return (d && (d.date_correction_verified || d.corrected_date)) || null;
}
function isUncorrected(d) {
  return !(d && (d.corrected_date || d.date_correction_verified));
}
function riskHit(level, ageDays) {
  var l = String(level || "");
  var full = 0;
  if (l === "High") full = 8;
  else if (l === "Medium High" || l.indexOf("Medium High") === 0) full = 5;
  else if (l === "Medium") full = 3;
  else if (l === "Medium Low" || l.indexOf("Medium Low") === 0) full = 2;
  else if (l === "Low") full = 1;
  if (!full) return 0;
  if (ageDays == null) return full;
  if (ageDays <= 365) return full;
  if (ageDays <= 730) return full / 2;
  return 0;
}
function gradeOf(op, defs, acts) {
  defs = defs || [];
  acts = acts || [];
  if (!op) return { letter: "—", score: null, cls: "g-Z", label: "Unknown", safety: 0, inspect: 0, capped: false, uncorrectedHigh12: false };
  var closed = String(op.operation_status).toUpperCase() !== "Y" || String(op.temporarily_closed).toUpperCase() === "YES";
  if (closed) return { letter: "—", score: null, cls: "g-Z", label: "Closed / inactive", safety: 0, inspect: 0, capped: false, uncorrectedHigh12: false };
  var safety = 0, uncorrectedHigh12 = false, i;
  for (i = 0; i < defs.length; i++) {
    var d = defs[i];
    var age = daysAgo(defWhen(d));
    safety -= riskHit(d.standard_risk_level, age);
    if (String(d.standard_risk_level) === "High" && isUncorrected(d) && (age == null || age <= 365)) uncorrectedHigh12 = true;
  }
  var inspect = 0, clean12 = 0, any24 = false;
  for (i = 0; i < acts.length; i++) {
    var a = acts[i];
    var aage = daysAgo(a.activity_date);
    if (aage == null || aage > 730) continue;
    any24 = true;
    var yes = String(a.violation_found || "").toUpperCase();
    yes = yes === "Y" || yes === "YES";
    if (aage <= 365) {
      if (yes) inspect -= 2;
      else if (String(a.activity_type || "").toUpperCase() === "INSPECTION") clean12 += 1;
    } else if (yes) inspect -= 1;
  }
  inspect += Math.min(5, clean12);
  if (!any24) inspect -= 5;
  var raw = 100 + safety + inspect;
  var capped = false;
  if (uncorrectedHigh12 && raw > 79) { raw = 79; capped = true; }
  var score = Math.max(0, Math.min(100, Math.round(raw)));
  var letter = score >= 90 ? "A" : score >= 80 ? "B" : score >= 70 ? "C" : score >= 60 ? "D" : "F";
  return { letter: letter, score: score, cls: "g-" + letter, label: score + " / 100", safety: Math.round(safety), inspect: inspect, capped: capped, uncorrectedHigh12: uncorrectedHigh12 };
}

  function mixHTML(g) {
    var cap = g.uncorrectedHigh12
      ? "This file is capped at 79. Uncorrected High in the last year cannot be erased. Google is a separate exhibit."
      : "Parent-perspective mix from the HHSC file. Google is a separate exhibit.";
    return '<div id="grade-mix"><table class="mix-ledger"><thead><tr>' +
      "<th>Safety</th><th>Inspections</th></tr></thead><tbody><tr>" +
      "<td>" + signed(g.safety) + "</td>" +
      "<td>" + signed(g.inspect) + "</td></tr></tbody></table>" +
      '<p class="mix-cap">' + cap + "</p></div>";
  }
  function stampEl(g) {
    return '<div class="stamp stamp-lg ' + g.cls + '" title="' + escapeHtml(g.label) +
      '"><div class="stamp-core"><span class="stamp-letter">' + escapeHtml(g.letter) +
      "</span><small>24 MO</small></div></div>";
  }

  function fetchJson(url, ms) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, ms || 12000);
    return fetch(url, { signal: ctrl.signal }).then(function (res) {
      if (!res.ok) throw new Error("Texas open data returned " + res.status);
      return res.json();
    }).catch(function (e) {
      if (e && e.name === "AbortError") throw new Error("Texas open data timed out");
      throw e;
    }).finally(function () { clearTimeout(t); });
  }

  function sodaUrl(base, params) {
    var url = new URL(base);
    Object.keys(params).forEach(function (k) { url.searchParams.set(k, params[k]); });
    return url.toString();
  }

  function safeId(id) {
    return String(id || "").replace(/[^0-9A-Za-z-]/g, "");
  }

  function getFacility(id) {
    var sid = safeId(id);
    return fetchJson(sodaUrl(OPS, { operation_id: sid, "$limit": "1" }), 12000).then(function (rows) {
      return (rows && rows[0]) || null;
    });
  }

  function getInspections(id) {
    return fetchJson(sodaUrl(ACT, {
      "$where": "operation_id='" + safeId(id) + "'",
      "$order": "activity_date DESC",
      "$limit": "50"
    }), 12000).catch(function () { return []; });
  }

  function getDeficiencies(id) {
    return fetchJson(sodaUrl(NC, {
      "$where": "operation_id='" + safeId(id) + "'",
      "$order": "corrected_date DESC",
      "$limit": "80"
    }), 12000).catch(function () { return []; });
  }

  function riskClass(level) {
    var l = String(level || "");
    if (l === "High") return "risk High";
    if (l.indexOf("Medium High") !== -1) return "risk mh";
    return "risk";
  }

  function stars(n) {
    var r = Math.max(0, Math.min(5, Math.round(Number(n) || 0)));
    return '<span class="stars">' + "★".repeat(r) + "☆".repeat(5 - r) + "</span>";
  }

  function reviewText(rev) {
    if (!rev) return "";
    if (typeof rev.text === "string") return rev.text;
    if (rev.text && typeof rev.text.text === "string") return rev.text.text;
    return "";
  }

  function googleShell(inner) {
    return '<div class="g-rule" aria-hidden="true"></div>' +
      '<div class="clip-sheet"><div class="g-kicker">Third-party sentiment · not part of the letter</div>' +
      inner + "</div>";
  }

  function loadGoogleReviews(op, mount) {
    var done = false;
    var timer;
    var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
    function finish(html) {
      if (done) return;
      done = true;
      if (timer) clearTimeout(timer);
      mount.innerHTML = html;
    }
    mount.innerHTML = googleShell("<p class=\"muted\">Pulling live from Google. Not stored.</p>");
    timer = setTimeout(function () {
      if (ctrl) {
        try { ctrl.abort(); } catch (e) {}
      }
      finish(googleShell("<p class=\"muted\">Could not load Google reviews right now.</p>"));
    }, 45000);
    if (typeof findGoogleListing !== "function") {
      finish(googleShell("<p class=\"muted\">Could not load Google reviews right now.</p>"));
      return;
    }
    findGoogleListing(op, { reviews: true, signal: ctrl && ctrl.signal }).then(function (listing) {
      if (done) return;
      if (!listing) {
        finish(googleShell("<p class=\"muted\">No Google listing matched this name and city. Live, not stored.</p>"));
        return;
      }
      var reviews = (listing.reviews || []).filter(function (rev) {
        return String((rev && rev.text) || "").trim();
      });
      var quotes = reviews.map(function (rev) {
        return '<blockquote class="clip-quote"><strong>' + escapeHtml(rev.author) + " " + stars(rev.rating) +
          ' <span class="muted">' + escapeHtml(rev.when || "") +
          "</span></strong><p>" + escapeHtml(rev.text || "") + "</p></blockquote>";
      }).join("");
      finish(
        googleShell(
          '<b class="g-score">' +
          (listing.rating != null ? Number(listing.rating).toFixed(1) : "—") + "</b><div>" + stars(listing.rating) +
          ' <span class="g-count">' + (listing.count != null ? escapeHtml(String(listing.count)) + " reviews" : "") +
          '</span></div><div class="muted">' + escapeHtml(listing.name) +
          (listing.address ? " · " + escapeHtml(listing.address) : "") +
          "</div>" +
          (listing.maps ? '<p><a class="source-link" href="' + listing.maps + '" target="_blank" rel="noopener">See all on Google</a></p>' : "") +
          (quotes || "<p class=\"muted\">Google returned a listing but no review text.</p>") +
          "<p class=\"muted\">Live from Google for this page load. Not stored. Not part of the letter.</p>"
        )
      );
    }).catch(function () {
      finish(googleShell("<p class=\"muted\">Could not load Google reviews right now.</p>"));
    });
  }

  function render(op, acts, defs) {
    var g = gradeOf(op, defs, acts);
    var zip = zipOf(op);
    var id = safeId(op.operation_id);
    var hhsc = "https://childcare.hhs.texas.gov/Public/InspectionAndComplianceHistory?operationId=" + encodeURIComponent(id);
    document.title = (op.operation_name || "Facility") + " · How Safe Is My Daycare?";

    function shortViolation(d) {
      var s = String((d && d.standard_number_description) || "");
      var cut = s.indexOf(" - ");
      if (cut !== -1) s = s.slice(cut + 3);
      var narr = String((d && d.narrative) || "").replace(/\s+/g, " ").trim();
      if (narr && narr.length > 110) narr = narr.slice(0, 107) + "…";
      if (s && narr) return s + " · " + narr;
      return s || narr || "Violation on file";
    }
    var defsByAct = {};
    (defs || []).forEach(function (d) {
      var aid = String(d.activity_id || "");
      if (!aid) return;
      if (!defsByAct[aid]) defsByAct[aid] = [];
      defsByAct[aid].push(d);
    });
    var inspectHtml = acts.length ? acts.map(function (a) {
      var yes = String(a.violation_found || "").toUpperCase();
      yes = yes === "Y" || yes === "YES";
      var extra = "";
      if (yes) {
        var related = defsByAct[String(a.activity_id || "")] || [];
        extra = related.length
          ? related.slice(0, 2).map(shortViolation).join(" · ")
          : "See findings below.";
        extra = '<p class="muted">' + escapeHtml(extra) + "</p>";
      }
      return '<div class="sheet"><strong>' + escapeHtml(fmtDate(a.activity_date)) + " · " +
        escapeHtml(a.activity_type || "Activity") + '</strong><span class="muted">Violation found: ' +
        escapeHtml(a.violation_found || "—") + "</span>" + extra + "</div>";
    }).join("") : '<p class="muted">No inspection rows in the public file for this operation.</p>';

    var defHtml = defs.length ? defs.map(function (d) {
      var openHigh = String(d.standard_risk_level) === "High" && isUncorrected(d);
      return '<div class="finding' + (openHigh ? " is-open-high" : "") + '"><div class="finding-head"><strong>' +
        escapeHtml(d.standard_number_description || "Standard") + '</strong><span class="' +
        riskClass(d.standard_risk_level) + '">' + escapeHtml(d.standard_risk_level || "n/a") +
        "</span></div>" + (d.narrative ? "<p>" + escapeHtml(d.narrative) + "</p>" : "") +
        '<div class="muted">Corrected at inspection: ' +
        escapeHtml(d.corrected_at_inspection || "—") + " · Corrected " + escapeHtml(fmtDate(d.corrected_date)) +
        " · Verified " + escapeHtml(fmtDate(d.date_correction_verified)) + "</div></div>";
    }).join("") : '<p class="muted">No published non-compliance rows. That can still mean a thin file — read the inspections above.</p>';

    var num = op.operation_number || op.operation_id;
    app.innerHTML =
      '<div class="crumb"><a href="index.html">Search</a> / ' + escapeHtml(op.city || "Texas") + "</div>" +
      '<div class="folder-head"><div class="title-row"><div>' +
      '<div class="kicker">' + escapeHtml(op.operation_type || "") + " · #" +
      escapeHtml(String(num)) + " · " + escapeHtml(op.city || "Texas") + " TX" + (zip ? " " + zip : "") + "</div>" +
      "<h1>" + escapeHtml(op.operation_name || "Facility") + "</h1>" +
      (g.uncorrectedHigh12 ? '<div class="ledger ledger-mix"><span class="high-mark">High</span></div>' : "") +
      '<p class="muted">' + escapeHtml(op.location_address || "") + (zip ? " · " + zip : "") + "</p>" +
      "</div>" + stampEl(g) + "</div></div>" +
      '<a class="official-bar" href="' + hhsc + '" target="_blank" rel="noopener">Open the official HHSC file</a>' +
      mixHTML(g) +
      '<div class="stats">' +
      '<div class="stat"><b>' + (op.operation_status === "Y" ? "Open" : "Inactive") + "</b><span>License status</span></div>" +
      '<div class="stat"><b>' + escapeHtml(op.total_capacity || "—") + "</b><span>Licensed capacity</span></div>" +
      '<div class="stat"><b>' + escapeHtml(op.licensed_to_serve_ages || "—") + "</b><span>Ages</span></div>" +
      '<div class="stat"><b>' + escapeHtml(op.total_inspections || "0") + "</b><span>Inspections on file</span></div>" +
      '<div class="stat"><b>' + escapeHtml(op.type_of_issuance || "—") + "</b><span>Issuance</span></div>" +
      '<div class="stat"><b>' + escapeHtml(fmtDate(op.issuance_date)) + "</b><span>Issued</span></div>" +
      "</div>" +
      '<p class="muted">Hours ' + escapeHtml(op.hours_of_operation || "—") + " · " +
      escapeHtml(op.days_of_operation || "") + " · Adverse action: " +
      escapeHtml(op.adverse_action || "—") + " · Corrective action: " +
      escapeHtml(op.corrective_action || "—") + "</p>" +
      '<div class="section"><h2>Inspections</h2>' + inspectHtml + "</div>" +
      '<div class="section"><h2>Findings</h2>' + defHtml + "</div>";

    rendered = true;
    var gMount = document.createElement("div");
    gMount.className = "g-section";
    gMount.id = "google-reviews";
    app.appendChild(gMount);
    try { loadGoogleReviews(op, gMount); } catch (e) {
      gMount.innerHTML = googleShell("<p class=\"muted\">Could not load Google reviews right now.</p>");
    }
  }

  function boot() {
    var id = new URLSearchParams(location.search).get("id");
    if (!id) {
      showError("Missing facility id");
      return;
    }
    Promise.all([getFacility(id), getInspections(id), getDeficiencies(id)])
      .then(function (parts) {
        var op = parts[0], acts = parts[1] || [], defs = parts[2] || [];
        if (!op) throw new Error("That operation id is not in the Texas daycare file.");
        render(op, acts, defs);
      })
      .catch(function (e) {
        showError((e && e.message) || e);
      });
  }

  boot();
})();
</script>
</body>
</html>
