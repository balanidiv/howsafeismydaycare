<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facility · How Safe Is My Daycare?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;650;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="google-place.js"></script>
  <script src="grade.js"></script>
</head>
<body>
  <header class="chrome">
    <div class="wrap chrome-inner">
      <a class="logo" href="index.html">how <em>safe</em></a>
      <button type="button" class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="drawer">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="drawer" id="drawer">
      <div class="wrap">
        <a href="about.html">How this works</a>
        <a href="https://divy.am" rel="noopener">Div Balani</a>
      </div>
    </nav>
  </header>
  <div class="wrap">
    <div class="page" id="app">
      <p class="muted" id="load-status">Opening the official record from Texas HHSC…</p>
    </div>
  </div>
  <footer>
    <div class="wrap">
      <div>Source: Texas HHSC Child Care Licensing open data. Not an official state grade.</div>
      <div><a href="about.html">Methodology</a></div>
    </div>
  </footer>
  <script>
(function () {
  var chrome = document.querySelector(".chrome");
  var btn = document.getElementById("burger");
  if (chrome && btn) {
    btn.addEventListener("click", function () {
      var open = chrome.classList.toggle("is-open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  }

  var app = document.getElementById("app");
  var rendered = false;

  function showError(msg) {
    rendered = true;
    if (!app) return;
    app.innerHTML = '<div class="err"></div><p><a href="index.html">Back to search</a></p>';
    app.querySelector(".err").textContent = String(msg || "Could not load this record.");
  }

  window.addEventListener("error", function (ev) {
    if (!rendered) showError((ev && ev.message) || "Page script failed.");
  });
  window.addEventListener("unhandledrejection", function (ev) {
    if (!rendered) showError((ev && ev.reason && ev.reason.message) || "Request failed.");
  });
  setTimeout(function () {
    if (rendered) return;
    var el = document.getElementById("load-status");
    if (el) el.textContent = "Still talking to Texas HHSC. This can take a few seconds on a cold pull…";
  }, 2000);
  setTimeout(function () {
    if (!rendered) showError("Texas open data is taking too long. Refresh to try again.");
  }, 10000);

  var SODA = "https://data.texas.gov/resource";
  var OPS = SODA + "/bc5r-88dy.json";
  var ACT = SODA + "/m5q4-3y3d.json";
  var NC = SODA + "/tqgd-mf4x.json";

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function zipOf(op) {
    return String((op && op.zipcode) || "").replace(/\s+/g, " ").trim().slice(0, 5);
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  function signed(n) {
    var v = Number(n) || 0;
    if (v > 0) return "+" + v;
    if (v < 0) return "\u2212" + Math.abs(v);
    return "0";
  }

  function mixHTML(g) {
    var cap = g.capped
      ? '<p class="mix-cap">This file is capped at 79. Uncorrected High in the last 24 months cannot be erased. Google is a separate exhibit.</p>'
      : "";
    return '<div id="grade-mix" class="mix-quiet">' +
      "<div><b>" + signed(g.safety) + "</b><span>Safety</span></div>" +
      "<div><b>" + signed(g.inspect) + "</b><span>Inspections</span></div>" +
      '<div class="mix-google"><b id="mix-google-num">—</b><span>Google</span></div></div>' + cap;
  }
  function tileEl(g, defs, acts) {
    var driver = gradeDriver(g, defs, acts);
    var scar = isScarDriver(driver) ? " is-scar" : "";
    return '<div class="grade-tile grade-lg ' + g.cls + '" title="' +
      escapeHtml(g.label) + '">' + escapeHtml(g.letter) + '</div>' +
      '<p class="grade-driver' + scar + '">' + escapeHtml(driver) + "</p>";
  }

  function fetchJson(url, ms) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, ms || 12000);
    return fetch(url, { signal: ctrl.signal }).then(function (res) {
      if (!res.ok) throw new Error("Texas open data returned " + res.status);
      return res.json();
    }).catch(function (e) {
      if (e && e.name === "AbortError") throw new Error("Texas open data timed out");
      throw e;
    }).finally(function () { clearTimeout(t); });
  }

  function sodaUrl(base, params) {
    var url = new URL(base);
    Object.keys(params).forEach(function (k) { url.searchParams.set(k, params[k]); });
    return url.toString();
  }

  function safeId(id) {
    return String(id || "").replace(/[^0-9A-Za-z-]/g, "");
  }

  function getFacility(id) {
    var sid = safeId(id);
    return fetchJson(sodaUrl(OPS, { operation_id: sid, "$limit": "1" }), 12000).then(function (rows) {
      return (rows && rows[0]) || null;
    });
  }

  function getInspections(id) {
    return fetchJson(sodaUrl(ACT, {
      "$where": "operation_id='" + safeId(id) + "'",
      "$order": "activity_date DESC",
      "$limit": "2000"
    }), 12000).catch(function () { return []; });
  }

  function getDeficiencies(id) {
    return fetchJson(sodaUrl(NC, {
      "$where": "operation_id='" + safeId(id) + "'",
      "$limit": "2000"
    }), 12000).catch(function () { return []; });
  }

  function riskClass(level) {
    var l = String(level || "");
    if (l === "High") return "risk High";
    if (l.indexOf("Medium High") !== -1) return "risk mh";
    return "risk";
  }

  function riskLabel(level) {
    var l = String(level || "n/a");
    if (l === "High") return "HIGH";
    return l;
  }

  function stars(n) {
    var r = Math.max(0, Math.min(5, Math.round(Number(n) || 0)));
    return '<span class="stars">' + "★".repeat(r) + "☆".repeat(5 - r) + "</span>";
  }

  function reviewText(rev) {
    if (!rev) return "";
    if (typeof rev.text === "string") return rev.text;
    if (rev.text && typeof rev.text.text === "string") return rev.text.text;
    return "";
  }

  function googleShell(inner, mode) {
    var live = mode === "live";
    var cls = live ? "g-sheet" : "g-sheet is-empty";
    var kicker = '<div class="g-kicker">GOOGLE · NOT PART OF THE LETTER</div>';
    return '<div class="' + cls + '">' + kicker + inner + "</div>";
  }

  function setMixGoogle(listing) {
    var el = document.getElementById("mix-google-num");
    if (!el) return;
    if (listing && listing.rating != null) el.textContent = Number(listing.rating).toFixed(1);
    else el.textContent = "—";
  }

  function loadGoogleReviews(op, mount) {
    var done = false;
    var timer;
    var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
    function finish(html, listing) {
      if (done) return;
      done = true;
      if (timer) clearTimeout(timer);
      mount.innerHTML = html;
      setMixGoogle(listing || null);
    }
    mount.innerHTML = googleShell("<p class=\"muted\">Pulling live from Google. Not stored.</p>", "empty");
    timer = setTimeout(function () {
      if (ctrl) {
        try { ctrl.abort(); } catch (e) {}
      }
      finish(googleShell("<p class=\"g-empty\">Could not load Google reviews right now.</p>", "error"));
    }, 45000);
    if (typeof findGoogleListing !== "function") {
      finish(googleShell("<p class=\"g-empty\">Could not load Google reviews right now.</p>", "error"));
      return;
    }
    findGoogleListing(op, { reviews: true, signal: ctrl && ctrl.signal }).then(function (listing) {
      if (done) return;
      if (!listing) {
        finish(googleShell("<p class=\"g-empty\">No Google listing.</p>", "empty"));
        return;
      }
      var reviews = (listing.reviews || []).filter(function (rev) {
        return String((rev && rev.text) || "").trim();
      });
      var quotes = reviews.map(function (rev) {
        return '<blockquote class="clip-quote"><strong>' + escapeHtml(rev.author) + " " + stars(rev.rating) +
          ' <span class="muted">' + escapeHtml(rev.when || "") +
          "</span></strong><p>" + escapeHtml(rev.text || "") + "</p></blockquote>";
      }).join("");
      finish(
        googleShell(
          '<b class="g-score">' +
          (listing.rating != null ? Number(listing.rating).toFixed(1) : "—") + "</b><div>" + stars(listing.rating) +
          ' <span class="g-count">' + (listing.count != null ? escapeHtml(String(listing.count)) + " reviews" : "") +
          '</span></div><div class="muted">' + escapeHtml(listing.name) +
          (listing.address ? " · " + escapeHtml(listing.address) : "") +
          "</div>" +
          (listing.maps ? '<p><a class="source-link" href="' + listing.maps + '" target="_blank" rel="noopener">See all on Google</a></p>' : "") +
          (quotes || "<p class=\"muted\">Google returned a listing but no review text.</p>") +
          "<p class=\"muted\">Live from Google for this page load. Not stored. Not part of the letter.</p>",
          "live"
        ),
        listing
      );
    }).catch(function () {
      finish(googleShell("<p class=\"g-empty\">Could not load Google reviews right now.</p>", "error"));
    });
  }

  function render(op, acts, defs) {
    var g = gradeOf(op, defs, acts);
    var zip = zipOf(op);
    var id = safeId(op.operation_id);
    var hhsc = "https://childcare.hhs.texas.gov/Public/InspectionAndComplianceHistory?operationId=" + encodeURIComponent(id);
    document.title = (op.operation_name || "Facility") + " · How Safe Is My Daycare?";

    function shortViolation(d) {
      var s = String((d && d.standard_number_description) || "");
      var cut = s.indexOf(" - ");
      if (cut !== -1) s = s.slice(cut + 3);
      var narr = String((d && d.narrative) || "").replace(/\s+/g, " ").trim();
      if (narr && narr.length > 110) narr = narr.slice(0, 107) + "…";
      if (s && narr) return s + " · " + narr;
      return s || narr || "Violation on file";
    }
    var defsByAct = {};
    (defs || []).forEach(function (d) {
      var aid = String(d.activity_id || "");
      if (!aid) return;
      if (!defsByAct[aid]) defsByAct[aid] = [];
      defsByAct[aid].push(d);
    });
    var inspectHtml = acts.length ? acts.map(function (a) {
      var yes = String(a.violation_found || "").toUpperCase();
      yes = yes === "Y" || yes === "YES";
      var extra = "";
      if (yes) {
        var related = defsByAct[String(a.activity_id || "")] || [];
        extra = related.length
          ? related.slice(0, 2).map(shortViolation).join(" · ")
          : "See findings below.";
        extra = '<p class="muted">' + escapeHtml(extra) + "</p>";
      }
      return '<div class="sheet"><strong>' + escapeHtml(fmtDate(a.activity_date)) + " · " +
        escapeHtml(a.activity_type || "Activity") + '</strong><span class="muted">Violation found: ' +
        escapeHtml(a.violation_found || "—") + "</span>" + extra + "</div>";
    }).join("") : '<p class="muted">No inspection rows in the public file for this operation.</p>';

    var defHtml = defs.length ? defs.map(function (d) {
      var openHigh = String(d.standard_risk_level) === "High" && isUncorrected(d);
      var rowClass = "finding" + (openHigh ? " is-open-high" : "") + (!isUncorrected(d) ? " is-corrected" : "");
      return '<div class="' + rowClass + '"><div class="finding-head"><strong>' +
        escapeHtml(d.standard_number_description || "Standard") + '</strong><span class="' +
        riskClass(d.standard_risk_level) + '">' + escapeHtml(riskLabel(d.standard_risk_level)) +
        "</span></div>" + (d.narrative ? "<p>" + escapeHtml(d.narrative) + "</p>" : "") +
        '<div class="muted">Corrected at inspection: ' +
        escapeHtml(d.corrected_at_inspection || "—") + " · Corrected " + escapeHtml(fmtDate(d.corrected_date)) +
        " · Verified " + escapeHtml(fmtDate(d.date_correction_verified)) + "</div></div>";
    }).join("") : '<p class="muted">No published non-compliance rows. That can still mean a thin file — read the inspections above.</p>';

    var num = op.operation_number || op.operation_id;
    var high = g.uncorrectedHigh ? '<div class="high-word">HIGH</div>' : "";
    app.innerHTML =
      '<div class="crumb"><a href="index.html">Search</a> / ' + escapeHtml(op.city || "Texas") + "</div>" +
      '<div class="folder-head"><div class="title-row">' + tileEl(g, defs, acts) + "<div>" +
      '<div class="kicker">' + escapeHtml(op.operation_type || "") + " · #" +
      escapeHtml(String(num)) + " · " + escapeHtml(op.city || "Texas") + " TX" + (zip ? " " + zip : "") + "</div>" +
      "<h1>" + escapeHtml(op.operation_name || "Facility") + "</h1>" +
      high +
      '<p class="muted">' + escapeHtml(op.location_address || "") + (zip ? " · " + zip : "") + "</p>" +
      "</div></div></div>" +
      '<a class="official-bar" href="' + hhsc + '" target="_blank" rel="noopener">Open the official HHSC file</a>' +
      mixHTML(g) +
      '<div class="g-section" id="google-reviews"></div>' +
      '<div class="facts"><p>' +
      (op.operation_status === "Y" ? "Open" : "Inactive") +
      " · Capacity " + escapeHtml(op.total_capacity || "—") +
      " · Ages " + escapeHtml(op.licensed_to_serve_ages || "—") +
      " · " + escapeHtml(op.total_inspections || "0") + " inspections on file</p>" +
      "<p>Hours " + escapeHtml(op.hours_of_operation || "—") + " · " +
      escapeHtml(op.days_of_operation || "") + " · Adverse action: " +
      escapeHtml(op.adverse_action || "—") + " · Corrective action: " +
      escapeHtml(op.corrective_action || "—") + "</p></div>" +
      '<div class="section"><h2>Inspections</h2>' + inspectHtml + "</div>" +
      '<div class="section"><h2>Findings</h2>' + defHtml + "</div>";

    rendered = true;
    var gMount = document.getElementById("google-reviews");
    try { loadGoogleReviews(op, gMount); } catch (e) {
      gMount.innerHTML = googleShell("<p class=\"g-empty\">Could not load Google reviews right now.</p>", "error");
    }
  }

  function boot() {
    var id = new URLSearchParams(location.search).get("id");
    if (!id) {
      showError("Missing facility id");
      return;
    }
    Promise.all([getFacility(id), getInspections(id), getDeficiencies(id)])
      .then(function (parts) {
        var op = parts[0], acts = parts[1] || [], defs = parts[2] || [];
        if (!op) throw new Error("That operation id is not in the Texas daycare file.");
        render(op, acts, defs);
      })
      .catch(function (e) {
        showError((e && e.message) || e);
      });
  }

  boot();
})();
</script>
</body>
</html>
