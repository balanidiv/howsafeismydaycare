      <div><a href="about.html">Methodology &amp; limits</a></div>

  </footer>
  <script>
const SODA = "https://data.texas.gov/resource";
const OPS = `${SODA}/bc5r-88dy.json`;
const ACT = `${SODA}/m5q4-3y3d.json`;
const NC = `${SODA}/tqgd-mf4x.json`;
const DAYCARE_TYPES = [
  "Licensed Center",
  "Licensed Child-Care Home",
  "Registered Child-Care Home",
  "Listed Family Home",
];
const TYPE_SQL = DAYCARE_TYPES.map((t) => `'${t}'`).join(",");
const AUSTIN = { lat: 30.2672, lng: -97.7431 };
const MAP_STYLE = [
  { elementType: "geometry", stylers: [{ color: "#f6f5f2" }] },
  { elementType: "labels.text.fill", stylers: [{ color: "#1a1a1a" }] },
  { elementType: "labels.text.stroke", stylers: [{ color: "#f6f5f2" }] },
  { featureType: "poi", stylers: [{ visibility: "off" }] },
  { featureType: "transit", stylers: [{ visibility: "off" }] },
  { featureType: "road", elementType: "geometry", stylers: [{ color: "#ffffff" }] },
  { featureType: "road.arterial", elementType: "geometry", stylers: [{ color: "#f0ece4" }] },
  { featureType: "water", stylers: [{ color: "#d7e3ee" }] },
  { featureType: "administrative", elementType: "geometry.stroke", stylers: [{ color: "#e8e4dc" }] }
];


function daysAgo(raw) {
  if (!raw) return null;
  var d = new Date(raw);
  if (Number.isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function defWhen(d) {
  return (d && (d.date_correction_verified || d.corrected_date)) || null;
}
function isUncorrected(d) {
  return !(d && (d.corrected_date || d.date_correction_verified));
}
function riskHit(level, ageDays) {
  var l = String(level || "");
  var full = 0;
  if (l === "High") full = 8;
  else if (l === "Medium High" || l.indexOf("Medium High") === 0) full = 5;
  else if (l === "Medium") full = 3;
  else if (l === "Medium Low" || l.indexOf("Medium Low") === 0) full = 2;
  else if (l === "Low") full = 1;
  if (!full) return 0;
  if (ageDays == null) return full;
  if (ageDays <= 365) return full;
  if (ageDays <= 730) return full / 2;
  return 0;
}
function gradeOf(op, defs, acts) {
  defs = defs || [];
  acts = acts || [];
  if (!op) return { letter: "—", score: null, cls: "g-Z", label: "Unknown", safety: 0, inspect: 0, capped: false, uncorrectedHigh12: false };
  var closed = String(op.operation_status).toUpperCase() !== "Y" || String(op.temporarily_closed).toUpperCase() === "YES";
  if (closed) return { letter: "—", score: null, cls: "g-Z", label: "Closed / inactive", safety: 0, inspect: 0, capped: false, uncorrectedHigh12: false };
  var safety = 0, uncorrectedHigh12 = false, i;
  for (i = 0; i < defs.length; i++) {
    var d = defs[i];
    var age = daysAgo(defWhen(d));
    safety -= riskHit(d.standard_risk_level, age);
    if (String(d.standard_risk_level) === "High" && isUncorrected(d) && (age == null || age <= 365)) uncorrectedHigh12 = true;
  }
  var inspect = 0, clean12 = 0, any24 = false;
  for (i = 0; i < acts.length; i++) {
    var a = acts[i];
    var aage = daysAgo(a.activity_date);
    if (aage == null || aage > 730) continue;
    any24 = true;
    var yes = String(a.violation_found || "").toUpperCase();
    yes = yes === "Y" || yes === "YES";
    if (aage <= 365) {
      if (yes) inspect -= 2;
      else if (String(a.activity_type || "").toUpperCase() === "INSPECTION") clean12 += 1;
    } else if (yes) inspect -= 1;
  }
  inspect += Math.min(5, clean12);
  if (!any24) inspect -= 5;
  var raw = 100 + safety + inspect;
  var capped = false;
  if (uncorrectedHigh12 && raw > 79) { raw = 79; capped = true; }
  var score = Math.max(0, Math.min(100, Math.round(raw)));
  var letter = score >= 90 ? "A" : score >= 80 ? "B" : score >= 70 ? "C" : score >= 60 ? "D" : "F";
  return { letter: letter, score: score, cls: "g-" + letter, label: score + " / 100", safety: Math.round(safety), inspect: inspect, capped: capped, uncorrectedHigh12: uncorrectedHigh12 };
}

function zipOf(op) {
  return String(op.zipcode || "").replace(/\s+/g, " ").trim().slice(0, 5);
}

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

function sodaWhere(expr, extra = "") {
  const url = new URL(OPS);
  url.searchParams.set("$where", expr);
  url.searchParams.set("$limit", "40");
  url.searchParams.set("$order", "deficiency_high DESC, operation_name ASC");
  if (extra) url.searchParams.set("$select", extra);
  return url.toString();
}

async function searchFacilities(q) {
  const raw = (q || "").trim();
  const type = `operation_type in (${TYPE_SQL})`;
  let where;
  if (!raw) {
    where = `${type} AND upper(city)='AUSTIN' AND operation_status='Y'`;
  } else if (/^\d{5}$/.test(raw)) {
    where = `${type} AND starts_with(zipcode,'${raw}')`;
  } else if (/^[A-Za-z .'-]+$/.test(raw) && raw.length < 28) {
    const city = raw.replace(/'/g, "''").toUpperCase();
    const name = city;
    where = `${type} AND (upper(city)='${city}' OR upper(operation_name) like '%${name}%')`;
  } else {
    const safe = raw.replace(/'/g, "''").toUpperCase();
    where = `${type} AND (upper(operation_name) like '%${safe}%' OR upper(city) like '%${safe}%' OR zipcode like '${safe}%')`;
  }
  const res = await fetch(sodaWhere(where));
  if (!res.ok) throw new Error(`Texas open data returned ${res.status}`);
  return res.json();
}

async function getFacility(id) {
  const url = new URL(OPS);
  url.searchParams.set("$where", `operation_id='${id}'`);
  url.searchParams.set("$limit", "1");
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Texas open data returned ${res.status}`);
  const rows = await res.json();
  return rows[0] || null;
}

async function getInspections(id) {
  const url = new URL(ACT);
  url.searchParams.set("$where", `operation_id='${id}'`);
  url.searchParams.set("$order", "activity_date DESC");
  url.searchParams.set("$limit", "50");
  const res = await fetch(url);
  if (!res.ok) return [];
  return res.json();
}

async function getDeficiencies(id) {
  const url = new URL(NC);
  url.searchParams.set("$where", `operation_id='${id}'`);
  url.searchParams.set("$order", "corrected_date DESC");
  url.searchParams.set("$limit", "80");
  const res = await fetch(url);
  if (!res.ok) return [];
  return res.json();
}


function safeId(id) { return String(id || "").replace(/[^0-9A-Za-z-]/g, ""); }
function groupByOp(rows) {
  var out = {};
  (rows || []).forEach(function (r) {
    var id = String(r.operation_id || "");
    if (!out[id]) out[id] = [];
    out[id].push(r);
  });
  return out;
}
async function loadHistory(ids) {
  var safe = (ids || []).map(safeId).filter(Boolean);
  if (!safe.length) return { defs: {}, acts: {} };
  var inn = safe.map(function (id) { return "'" + id + "'"; }).join(",");
  async function grab(base, extra) {
    var url = new URL(base);
    url.searchParams.set("$where", "operation_id in (" + inn + ")");
    url.searchParams.set("$limit", "2000");
    Object.keys(extra || {}).forEach(function (k) { url.searchParams.set(k, extra[k]); });
    var res = await fetch(url);
    if (!res.ok) return [];
    return res.json();
  }
  const [defs, acts] = await Promise.all([
    grab(NC, {}),
    grab(ACT, { "$order": "activity_date DESC" }),
  ]);
  return { defs: groupByOp(defs), acts: groupByOp(acts) };
}

function signed(n) {
  var v = Number(n) || 0;
  if (v > 0) return "+" + v;
  if (v < 0) return "\u2212" + Math.abs(v);
  return "0";
}

function gradeDriver(g, defs, acts) {
  if (!g || g.letter === "—" || g.cls === "g-Z") return (g && g.label) || "Closed or inactive.";
  var high12 = 0, high24 = 0, openHigh = 0, any24 = false, i;
  for (i = 0; i < (defs || []).length; i++) {
    var d = defs[i];
    if (String(d.standard_risk_level) !== "High") continue;
    var age = daysAgo(defWhen(d));
    if (age != null && age > 730) continue;
    high24 += 1;
    if (age == null || age <= 365) {
      high12 += 1;
      if (isUncorrected(d)) openHigh += 1;
    }
  }
  for (i = 0; i < (acts || []).length; i++) {
    var aage = daysAgo(acts[i].activity_date);
    if (aage != null && aage <= 730) any24 = true;
  }
  if (g.uncorrectedHigh12 || openHigh) return "Uncorrected High this year.";
  if (high12) return "High finding in the last 12 months.";
  if (high24) return "High finding in the last 24 months.";
  if (!any24) return "No inspections in 24 months.";
  if (!high24) return "No High in 24 months.";
  return "Findings in the last 24 months.";
}

function licenseKicker(op) {
  var city = String(op.city || "").trim() || "Texas";
  var st = String(op.state || "TX").trim() || "TX";
  var zip = zipOf(op);
  var type = op.operation_type || "Licensed operation";
  var num = op.operation_number || op.operation_id || "";
  var loc = [city, st, zip].filter(Boolean).join(" ");
  return type + " · #" + num + " · " + loc;
}

function inspectCount24(acts) {
  var n = 0;
  (acts || []).forEach(function (a) {
    var age = daysAgo(a.activity_date);
    if (age != null && age <= 730) n += 1;
  });
  return n;
}

function cardHTML(op, hist) {
  hist = hist || { defs: {}, acts: {} };
  const id = String(op.operation_id || "");
  const acts = hist.acts[id] || [];
  const defs = hist.defs[id] || [];
  const g = gradeOf(op, defs, acts);
  const href = `facility.html?id=${encodeURIComponent(op.operation_id)}`;
  const high = g.uncorrectedHigh12 ? '<div class="high-word">HIGH</div>' : "";
  const driver = gradeDriver(g, defs, acts);
  return `<article class="card" data-card="${escapeHtml(id)}">
    <div class="card-grade">
      <div class="grade-tile ${g.cls}" title="${escapeHtml(g.label)}">${escapeHtml(g.letter)}</div>
      <p class="grade-driver">${escapeHtml(driver)}</p>
    </div>
    <div class="card-main">
      <h2>${escapeHtml(op.operation_name || "Unnamed facility")}</h2>
      <div class="file-kicker">${escapeHtml(licenseKicker(op))}</div>
      ${high}
      <aside class="g-badge is-empty" data-google-card="${escapeHtml(id)}"><div class="ex-kicker">GOOGLE</div></aside>
      <a class="learn" href="${href}">Learn more →</a>
    </div>
  </article>`;
}


var googleFillGen = 0;
var googleFillCtrl = null;

function isAbortErr(e) {
  return !!(e && (e.name === "AbortError" || String((e && e.message) || "").toLowerCase() === "aborted"));
}

function paintGoogleError(node) {
  if (!node) return;
  node.classList.add("is-empty");
  node.classList.add("is-error");
  node.innerHTML = '<div class="ex-kicker">GOOGLE</div><div class="ex-empty">Could not load</div>';
}

function fillGoogleRatings(ops) {
  if (googleFillCtrl) {
    try { googleFillCtrl.abort(); } catch (e) {}
  }
  googleFillCtrl = (typeof AbortController === "function") ? new AbortController() : null;
  var gen = ++googleFillGen;
  var signal = googleFillCtrl && googleFillCtrl.signal;
  var nodes = Array.prototype.slice.call(document.querySelectorAll("[data-google-card]"));
  function live() { return gen === googleFillGen; }

  if (typeof findGoogleListing !== "function") {
    nodes.forEach(paintGoogleError);
    return;
  }
  if (!ops || !ops.length) {
    nodes.forEach(function (node) { paintGoogleBadge(node, null); });
    return;
  }

  var byId = {};
  ops.forEach(function (op) { byId[String(op.operation_id || "")] = op; });
  var i = 0;
  function next() {
    if (!live()) return;
    if (i >= nodes.length) return;
    var node = nodes[i++];
    var op = byId[node.getAttribute("data-google-card")];
    if (!op) { paintGoogleBadge(node, null); return next(); }
    findGoogleListing(op, { reviews: false, signal: signal }).then(function (listing) {
      if (!live()) return;
      paintGoogleBadge(node, listing || null);
    }).catch(function (e) {
      if (!live()) return;
      if (isAbortErr(e)) return;
      paintGoogleError(node);
    }).then(next);
  }
  next();
}
function paintGoogleBadge(node, listing) {
  if (!node) return;
  node.classList.remove("is-error");
  if (!listing) {
    node.classList.add("is-empty");
    node.innerHTML = '<div class="ex-kicker">GOOGLE</div><div class="ex-empty">No Google listing.</div>';
    return;
  }
  node.classList.remove("is-empty");
  var rating = listing.rating;
  var count = listing.count;
  var num = (rating != null) ? Number(rating).toFixed(1) : "—";
  var r = (rating != null) ? Math.max(0, Math.min(5, Math.round(Number(rating) || 0))) : 0;
  var starRow = "★".repeat(r) + "☆".repeat(5 - r);
  var n = (count != null) ? String(count) : "";
  node.innerHTML = '<div class="ex-kicker">GOOGLE</div><div class="ex-num">' + num +
    '</div><div class="ex-stars">' + starRow + '</div><div class="ex-n">' + n + "</div>";
}


function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[c]));
}

function pinColor(letter) {
  if (letter === "A") return "#2f4a3c";
  if (letter === "B") return "#3f5e4e";
  if (letter === "C") return "#c47b1a";
  if (letter === "D") return "#9a4a12";
  if (letter === "F") return "#b42318";
  return "#1a1a1a";
}

function pinIcon(letter, color) {
  var safe = String(letter || "—").slice(0, 1);
  var size = 60;
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '">' +
    '<rect width="' + size + '" height="' + size + '" rx="14" fill="' + color + '"/>' +
    '<text x="30" y="40" text-anchor="middle" fill="#ffffff" font-family="Outfit,Arial,sans-serif" font-size="28" font-weight="700">' +
    safe + "</text></svg>";
  return {
    url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
    scaledSize: new google.maps.Size(size, size),
    anchor: new google.maps.Point(size / 2, size / 2)
  };
}

function geoQuery(op) {
  var street = String((op && op.address_line) || "").replace(/\s+/g, " ").trim();
  var city = String((op && op.city) || "").replace(/\s+/g, " ").trim();
  var st = String((op && op.state) || "TX").replace(/\s+/g, " ").trim() || "TX";
  var zip = zipOf(op);
  if (street) return [street, city, st, zip].filter(Boolean).join(", ");
  return String((op && op.location_address) || "").replace(/\s+/g, " ").trim();
}

var mapObj = null;
var geocoder = null;
var mapMarkers = [];
var geoCache = {};
var mapGen = 0;
var mapFailed = false;
var mapOopsWatch = null;

function mapHasOops(el) {
  if (!el) return false;
  if (el.querySelector(".gm-err-container, .gm-err-content, .gm-err-title, .gm-err-message, .gm-err-icon")) return true;
  var t = String(el.textContent || "");
  return t.indexOf("Oops!") !== -1 || t.indexOf("didn't load Google Maps") !== -1;
}

function failMap() {
  mapFailed = true;
  mapObj = null;
  geocoder = null;
  if (mapOopsWatch) {
    try { mapOopsWatch.disconnect(); } catch (e) {}
    mapOopsWatch = null;
  }
  var el = document.getElementById("map");
  if (!el) return;
  el.classList.add("is-unavailable");
  el.textContent = "Map unavailable.";
}

function watchMapOops(el) {
  if (!el || mapFailed) return;
  if (mapHasOops(el)) {
    failMap();
    return;
  }
  if (typeof MutationObserver === "function") {
    mapOopsWatch = new MutationObserver(function () {
      if (mapHasOops(el)) failMap();
    });
    mapOopsWatch.observe(el, { childList: true, subtree: true });
  }
  [0, 50, 250, 1000].forEach(function (ms) {
    setTimeout(function () {
      if (!mapFailed && mapHasOops(el)) failMap();
    }, ms);
  });
  setTimeout(function () {
    if (mapOopsWatch) {
      try { mapOopsWatch.disconnect(); } catch (e) {}
      mapOopsWatch = null;
    }
  }, 4000);
}

window.gm_authFailure = function () { failMap(); };

function ensureMap() {
  if (mapFailed) return Promise.resolve(null);
  if (mapObj) return Promise.resolve(mapObj);
  if (typeof loadGoogleMaps !== "function") {
    failMap();
    return Promise.resolve(null);
  }
  return loadGoogleMaps().then(function () {
    if (mapFailed) return null;
    if (!google || !google.maps) throw new Error("maps missing");
    var el = document.getElementById("map");
    el.textContent = "";
    mapObj = new google.maps.Map(el, {
      center: AUSTIN,
      zoom: 11,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false,
      clickableIcons: false,
      styles: MAP_STYLE
    });
    if (mapFailed || mapHasOops(el)) {
      failMap();
      return null;
    }
    watchMapOops(el);
    geocoder = new google.maps.Geocoder();
    return mapObj;
  }).catch(function () {
    failMap();
    return null;
  });
}

function geocodeOp(op) {
  var q = geoQuery(op);
  if (!q || !geocoder) return Promise.resolve(null);
  if (geoCache[q]) return Promise.resolve(geoCache[q]);
  return new Promise(function (resolve) {
    geocoder.geocode({ address: q, componentRestrictions: { country: "US" } }, function (res, status) {
      if (status === "OK" && res && res[0]) {
        geoCache[q] = res[0].geometry.location;
        resolve(geoCache[q]);
      } else {
        resolve(null);
      }
    });
  });
}

function mapLimit(items, n, fn) {
  var i = 0, active = 0;
  return new Promise(function (resolve) {
    function next() {
      if (i >= items.length && active === 0) { resolve(); return; }
      while (active < n && i < items.length) {
        (function (idx) {
          active += 1;
          Promise.resolve(fn(items[idx], idx)).catch(function () {}).then(function () {
            active -= 1;
            next();
          });
        })(i++);
      }
    }
    if (!items.length) resolve();
    else next();
  });
}

function clearMarkers() {
  mapMarkers.forEach(function (mk) { mk.setMap(null); });
  mapMarkers = [];
}

function syncMap(rows, hist) {
  var gen = ++mapGen;
  clearMarkers();
  ensureMap().then(function (m) {
    if (!m || mapFailed || gen !== mapGen) return;
    var bounds = new google.maps.LatLngBounds();
    return mapLimit(rows || [], 4, function (op) {
      if (mapFailed || gen !== mapGen) return;
      return geocodeOp(op).then(function (loc) {
        if (!loc || mapFailed || gen !== mapGen) return;
        var id = String(op.operation_id || "");
        var g = gradeOf(op, (hist.defs && hist.defs[id]) || [], (hist.acts && hist.acts[id]) || []);
        var mk = new google.maps.Marker({
          map: m,
          position: loc,
          icon: pinIcon(g.letter, pinColor(g.letter)),
          title: op.operation_name || "",
          optimized: true
        });
        mk.addListener("click", function () {
          var card = document.querySelector('[data-card="' + id + '"]');
          if (card) {
            card.scrollIntoView({ block: "nearest", behavior: "smooth" });
            card.classList.add("is-focus");
            setTimeout(function () { card.classList.remove("is-focus"); }, 1400);
          }
        });
        mapMarkers.push(mk);
        bounds.extend(loc);
      });
    }).then(function () {
      if (mapFailed || gen !== mapGen || !m) return;
      if (mapMarkers.length === 1) {
        m.setCenter(mapMarkers[0].getPosition());
        m.setZoom(13);
      } else if (mapMarkers.length > 1) {
        m.fitBounds(bounds, 48);
      } else {
        m.setCenter(AUSTIN);
        m.setZoom(11);
      }
    });
  });
}

function bindChrome() {
  var chrome = document.querySelector(".chrome");
  var btn = document.getElementById("burger");
  if (!chrome || !btn) return;
  btn.addEventListener("click", function () {
    var open = chrome.classList.toggle("is-open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
}

</script>
<script>
    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const status = document.getElementById("status");
    const results = document.getElementById("results");
    const err = document.getElementById("err");

    bindChrome();
    ensureMap();

    async function run(q) {
      err.innerHTML = "";
      status.textContent = "Looking up licensed operations…";
      results.innerHTML = "";
      clearMarkers();
      try {
        const rows = await searchFacilities(q);
        const hist = await loadHistory(rows.map((r) => r.operation_id));
        const filtered = !!(q && q.trim());
        status.textContent = rows.length
          ? (filtered
            ? (rows.length + " matches · map shows only these · not a state rating")
            : "Austin default · last 24 months · not a state rating")
          : ("No licensed operations matched " + (filtered ? q.trim() : "Austin") + ".");
        results.innerHTML = rows.map((op) => cardHTML(op, hist)).join("");
        fillGoogleRatings(rows);
        syncMap(rows, hist);
      } catch (e) {
        status.textContent = "";
        err.innerHTML = `<div class="err">${e.message}. The Texas open-data API may be rate-limiting. Try again in a moment.</div>`;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = input.value.trim();
      const url = new URL(location.href);
      if (q) url.searchParams.set("q", q); else url.searchParams.delete("q");
      history.replaceState(null, "", url);
      run(q);
    });
    document.querySelectorAll("[data-q]").forEach((b) => {
      b.addEventListener("click", () => {
        input.value = b.dataset.q;
        form.requestSubmit();
      });
    });
    const start = new URLSearchParams(location.search).get("q") || "";
    input.value = start;
    run(start);
  </script>
</body>
</html>
